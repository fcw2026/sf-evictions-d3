<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SF Evictions — Cause Breakdown (5 Neighborhoods)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .legend { font-size: 12px; color:#666; }
    .status { font-size: 12px; color:#444; margin-top: 6px; }
    .chart-wrap { max-width: 1100px; }
    svg { width: 100%; height: 560px; }
    .axis text { font-size: 12px; }
    .cause-legend { display:flex; gap:8px; flex-wrap:wrap; margin: 8px 0 16px; }
    .cause-legend span { display:inline-flex; align-items:center; gap:6px; font-size:12px; }
    .swatch { width:14px; height:14px; border-radius:2px; display:inline-block; }
    .title { font-size:18px; margin:12px 0 6px; }
    .error { background:#ffe3e3; color:#b00020; padding:10px; border-radius:6px; display:none; }
  </style>
</head>
<body>
  <h1>Eviction Notices — Cause Breakdown (Tenderloin, Mission, South of Market, Bayview Hunters Point, Chinatown)</h1>

  <div class="controls">
    <label><strong>Layout:</strong></label>
    <select id="layoutSel">
      <option value="grouped">Grouped (per cause)</option>
      <option value="stacked">Stacked (per neighborhood)</option>
    </select>
    <span class="legend">Source: Pre-aggregated JSON from the uploaded CSV</span>
  </div>

  <div id="status" class="status"></div>
  <div id="err" class="error"></div>
  <div id="title" class="title"></div>
  <div id="legend" class="cause-legend"></div>
  <div class="chart-wrap">
    <svg id="chart" height="560"></svg>
  </div>

  <!-- ✅ Proper D3 v7 script tag -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
  const FILE = "data/agg_by_neighborhood_cause.json"; // JSON in your repo
  const NEIGHBORHOODS = ["Tenderloin", "Mission", "South of Market", "Bayview Hunters Point", "Chinatown"];
  const CAUSES = [
    "Non Payment","Breach","Nuisance","Illegal Use","Failure to Sign Renewal","Access Denial",
    "Unapproved Subtenant","Owner Move In","Demolition","Capital Improvement","Substantial Rehab",
    "Ellis Act WithDrawal","Condo Conversion","Roommate Same Unit","Other Cause","Late Payments",
    "Lead Remediation","Development","Good Samaritan Ends"
  ];

  const svg = d3.select("#chart"),
        margin = {top: 28, right: 20, bottom: 90, left: 70},
        width  = svg.node().getBoundingClientRect().width - margin.left - margin.right,
        height = +svg.attr("height") - margin.top - margin.bottom,
        g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const color = d3.scaleOrdinal().domain(CAUSES)
    .range(d3.schemeTableau10.concat(d3.schemeSet2).slice(0, CAUSES.length));

  const x0 = d3.scaleBand().paddingInner(0.15).paddingOuter(0.05);
  const x1 = d3.scaleBand().padding(0.12);
  const y  = d3.scaleLinear();

  const xAxisG = g.append("g").attr("transform", `translate(0,${height})`);
  const yAxisG = g.append("g");

  const legend = d3.select("#legend");
  legend.selectAll("span").data(CAUSES).enter()
    .append("span").html(d => `<i class="swatch" style="background:${color(d)}"></i>${d}`);

  const setStatus = msg => d3.select("#status").text(msg);
  const showError = msg => {
    d3.select("#err").style("display","block").text(msg);
    console.error(msg);
  };

  d3.json(FILE).then(raw => {
    if (!raw || !raw.length) { showError("No JSON rows found. Check that agg_by_neighborhood_cause.json is in /data."); return; }

    // Filter json to the five neighborhoods
    const filtered = raw.filter(d => NEIGHBORHOODS.includes(d.neighborhood));
    if (!filtered.length) { showError("Filtered dataset is empty. Verify neighborhood names exactly match values."); return; }

    setStatus(`Loaded ${raw.length} rows; filtered to ${filtered.length} rows for 5 neighborhoods.`);

    // Build counts: cause -> neighborhood -> count
    const counts = {};
    for (const c of CAUSES) counts[c] = {};
    for (const nb of NEIGHBORHOODS) for (const c of CAUSES) counts[c][nb] = 0;

    filtered.forEach(d => {
      const { neighborhood, cause, count } = d;
      if (CAUSES.includes(cause)) {
        counts[cause][neighborhood] = (counts[cause][neighborhood] || 0) + (+count || 0);
      }
    });

    const groupedData = CAUSES.map(cause => ({
      cause,
      values: NEIGHBORHOODS.map(nb => ({ neighborhood: nb, count: counts[cause][nb] }))
    }));

    const stackedData = NEIGHBORHOODS.map(nb => ({
      neighborhood: nb,
      stacks: CAUSES.map(cause => ({ cause, count: counts[cause][nb] }))
    }));

    renderGrouped(groupedData);
    d3.select("#layoutSel").on("change", function() {
      const val = this.value;
      if (val === "grouped") renderGrouped(groupedData);
      else renderStacked(stackedData);
    });

    function renderGrouped(data) {
      d3.select("#title").text("Grouped bars: Neighborhood counts per cause");
      g.selectAll("*").remove();
      x0.domain(data.map(d => d.cause)).range([0, width]);
      x1.domain(NEIGHBORHOODS).range([0, x0.bandwidth()]);
      y.domain([0, d3.max(data, d => d3.max(d.values, v => v.count))]).nice().range([height, 0]);

      xAxisG.call(d3.axisBottom(x0)).selectAll("text").attr("transform","rotate(30)").style("text-anchor","start");
      yAxisG.call(d3.axisLeft(y));

      const causeG = g.selectAll(".cause-g").data(data, d => d.cause).enter()
        .append("g").attr("class","cause-g").attr("transform", d => `translate(${x0(d.cause)},0)`);

      causeG.selectAll("rect").data(d => d.values).enter().append("rect")
        .attr("x", d => x1(d.neighborhood))
        .attr("y", d => y(d.count))
        .attr("width", x1.bandwidth())
        .attr("height", d => height - y(d.count))
        .attr("fill", (d,i) => color(NEIGHBORHOODS[i]))
        .append("title").text(d => `${d.neighborhood}: ${d.count}`);

      causeG.selectAll("text").data(d => d.values).enter()
        .append("text")
        .attr("x", d => x1(d.neighborhood) + x1.bandwidth()/2)
        .attr("y", d => y(d.count) - 4)
        .attr("text-anchor","middle")
        .attr("font-size","11px")
        .text(d => d.count);
    }

    function renderStacked(data) {
      d3.select("#title").text("Stacked bars: Cause composition per neighborhood");
      g.selectAll("*").remove();
      x0.domain(data.map(d => d.neighborhood)).range([0, width]);
      y.domain([0, d3.max(data, d => d3.sum(d.stacks, s => s.count))]).nice().range([height, 0]);

      xAxisG.call(d3.axisBottom(x0));
      yAxisG.call(d3.axisLeft(y));

      const stack = d3.stack()
        .keys(CAUSES)
        .value((d, key) => {
          const item = d.stacks.find(s => s.cause === key);
          return item ? item.count : 0;
        });

      const series = stack(data);

      const causeG = g.selectAll(".series").data(series).enter().append("g")
        .attr("class","series").attr("fill", d => color(d.key));

      causeG.selectAll("rect").data(d => d).enter().append("rect")
        .attr("x", d => x0(d.data.neighborhood))
        .attr("y", d => y(d[1]))
        .attr("height", d => y(d[0]) - y(d[1]))
        .attr("width", x0.bandwidth())
        .append("title").text(d => {
          const count = d[1] - d[0];
          const cause = d3.select(d3.select(this).node().parentNode).datum().key;
          return `${d.data.neighborhood} — ${cause}: ${count}`;
        });

      g.selectAll(".total").data(data).enter().append("text")
        .attr("class","total")
        .attr("x", d => x0(d.neighborhood) + x0.bandwidth()/2)
        .attr("y", d => y(d3.sum(d.stacks, s => s.count)) - 6)
        .attr("text-anchor","middle")
        .attr("font-size","11px")
        .text(d => d3.sum(d.stacks, s => s.count));
    }
  }).catch(err => {
    showError("Failed to load JSON. Ensure index.html and /data/agg_by_neighborhood_cause.json exist.");
    console.error(err);
  });
  </script>
</body>
</html>
