<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title> Evictions of San Francisco's Five Neighborhoods (JSON)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .status { font-size: 12px; color:#444; margin: 6px 0 16px; }
    .error  { background:#ffe3e3; color:#b00020; padding:10px; border-radius:6px; display:none; }
  </style>
</head>
<body>
  <h1>Eviction Notices for San Francisco's Five Neighborhoods 2021-2025</h1>

  <div class="controls">
    <label><strong>Cause:</strong></label>
    <select id="causeSel"></select>
  </div>

  <div id="status" class="status"></div>
  <div id="err" class="error"></div>
  <svg id="chart" width="900" height="420"></svg>

  <!-- ✅ D3 v7 (correct script tag) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
  const FILE = "data/five_neighborhoods_by_cause.json";
  const NEIGHBORHOODS = ["Tenderloin","Mission","South of Market","Bayview Hunters Point","Chinatown"];
  // 19 causes from the source CSV schema:
  const CAUSES = [
    "Non Payment","Breach","Nuisance","Illegal Use","Failure to Sign Renewal","Access Denial",
    "Unapproved Subtenant","Owner Move In","Demolition","Capital Improvement","Substantial Rehab",
    "Ellis Act WithDrawal","Condo Conversion","Roommate Same Unit","Other Cause","Late Payments",
    "Lead Remediation","Development","Good Samaritan Ends"
  ];

  const svg = d3.select("#chart"),
        m = {top: 30, right: 20, bottom: 80, left: 70},
        w = +svg.attr("width") - m.left - m.right,
        h = +svg.attr("height") - m.top - m.bottom,
        g = svg.append("g").attr("transform", `translate(${m.left},${m.top})`);

  const x = d3.scaleBand().range([0, w]).padding(0.15);
  const y = d3.scaleLinear().range([h, 0]);

  const xAxis = g.append("g").attr("transform", `translate(0,${h})`);
  const yAxis = g.append("g");

  const status = msg => d3.select("#status").text(msg);
  const error  = msg => d3.select("#err").style("display","block").text(msg);

  // Populate dropdown
  const sel = d3.select("#causeSel");
  sel.selectAll("option").data(CAUSES).enter().append("option")
     .attr("value", d => d).text(d => d);

  d3.json(FILE).then(json => {
    if (!json) { error("No JSON content found. Check file path."); return; }

    function render(cause) {
      const rows = (json[cause] || [])
        .filter(d => NEIGHBORHOODS.includes(d.neighborhood))
        .map(d => ({ neighborhood: d.neighborhood, count: +d.count || 0 }))
        .sort((a,b) => d3.descending(a.count, b.count));

      if (!rows.length) { error("No rows after filter. Verify JSON and neighborhood names."); return; }
      status(`Loaded ${rows.length} entries for cause: ${cause}`);

      x.domain(rows.map(d => d.neighborhood));
      y.domain([0, d3.max(rows, d => d.count)]).nice();

      // Axes
      xAxis.call(d3.axisBottom(x)).selectAll("text")
        .attr("transform","rotate(20)").style("text-anchor","start");
      yAxis.call(d3.axisLeft(y));

      // Bars
      const bars = g.selectAll(".bar").data(rows, d => d.neighborhood);
      bars.enter().append("rect")
          .attr("class","bar")
          .attr("x", d => x(d.neighborhood))
          .attr("y", d => y(d.count))
          .attr("width", x.bandwidth())
          .attr("height", d => h - y(d.count))
          .attr("fill", "#4e79a7")
        .merge(bars)
          .transition().duration(400)
          .attr("x", d => x(d.neighborhood))
          .attr("y", d => y(d.count))
          .attr("width", x.bandwidth())
          .attr("height", d => h - y(d.count));
      bars.exit().remove();

      // Labels
      const labels = g.selectAll(".bar-label").data(rows, d => d.neighborhood);
      labels.enter().append("text")
          .attr("class","bar-label")
          .attr("x", d => x(d.neighborhood) + x.bandwidth()/2)
          .attr("y", d => y(d.count) - 6)
          .attr("text-anchor","middle")
          .text(d => d.count)
        .merge(labels)
          .transition().duration(400)
          .attr("y", d => y(d.count) - 6)
          .text(d => d.count);
      labels.exit().remove();
    }

    // Hook up dropdown
    sel.on("change", () => render(sel.property("value")));
    render("Non Payment"); // default view
  }).catch(err => {
    error("Failed to load JSON. Ensure the file is in /data and GitHub Pages is serving from root.");
    console.error(err);
  });
  </script>
</body>
</html>
